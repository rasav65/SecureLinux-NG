# SecureLinux-NG example config: paranoid
PROFILE=paranoid

# Дополнительная корпоративная парольная политика.
# По умолчанию отключена и не является требованием ФСТЭК.
ENABLE_CORPORATE_PASSWORD_POLICY=0

# Дополнительный блок из 17 модулей:
#  1. расширенное укрепление SSH;
#  2. аудит учётных записей;
#  3. AppArmor;
#  4. AIDE;
#  5. fail2ban;
#  6. rkhunter;
#  7. отключение опасных модулей ядра;
#  8. укрепление параметров монтирования;
#  9. защищённый /tmp как tmpfs;
# 10. UFW;
# 11. auditd и правила аудита;
# 12. rsyslog;
# 13. chrony;
# 14. unattended-upgrades;
# 15. отключение apport;
# 16. ограничение core dump;
# 17. дополнительные сетевые sysctl.
#
# По умолчанию отключён: обычный --apply выполняет основной hardening.
# Включение: ENABLE_ADDITIONAL_MEASURES=1 либо CLI-флаг
# --enable-additional-measures, допустимый только вместе с --apply.
# CLI-флаг имеет приоритет над значением 0 из config-файла.
# При включении manifest содержит additional_measures_enabled=true.
ENABLE_ADDITIONAL_MEASURES=0

# Необязательный явный список администраторов из sudo, admin или wheel.
# При пустом значении запуск через sudo автоматически использует
# проверенного SUDO_USER. Явно заданный список имеет приоритет.
WHEEL_USERS=
STATE_DIR=/var/log/securelinux-ng
# REPORT_FILE=/var/log/securelinux-ng/report.json
# MANIFEST_FILE=/var/log/securelinux-ng/manifest.json

# user.max_user_namespaces limit (FSTEC 2.5.5)
# Задайте явно для неинтерактивного apply; если оставить пустым,
# интерактивный запуск спросит администратора, а неинтерактивный пропустит пункт
# Используйте 10000 только при обоснованной необходимости Docker/Podman/K8s
# USER_NAMESPACES_LIMIT=10000

# Дополнительные разрешения UFW.
# Формат: порт/протокол:комментарий; несколько правил разделяются пробелами.
# UFW_EXTRA_RULES="15000/udp:Kaspersky 8080/tcp:Proxy"
